server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 6m;
  location /api/ { proxy_pass http://rizpay-api:3001; proxy_set_header Host $http_host; proxy_set_header Origin $http_origin; }
  location /v1/ { proxy_pass http://rizpay-api:3001; proxy_set_header Host $http_host; }
  location /health { proxy_pass http://rizpay-api:3001; }
  location / { try_files $uri $uri/ /index.html; }
}
