services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: rizpay_test
      MYSQL_USER: rizpay_test
      MYSQL_PASSWORD: isolated-test-password
      MYSQL_ROOT_PASSWORD: isolated-root-test-password
    healthcheck:
      test: [CMD-SHELL, 'mysqladmin ping -h localhost -u root -p"$$MYSQL_ROOT_PASSWORD"']
      interval: 5s
      retries: 30
  redis:
    image: redis:7-alpine
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      retries: 10
  tests:
    build:
      context: .
      dockerfile: docker/Dockerfile
    environment:
      DATABASE_URL: mysql://rizpay_test:isolated-test-password@mysql:3306/rizpay_test
      REDIS_URL: redis://redis:6379
      JWT_SECRET: isolated-jwt-test-secret-at-least-32-characters
      SECRET_ENCRYPTION_KEY: isolated-encryption-test-secret-at-least-32-characters
      NODE_ENV: test
    command: sh -c "npm run db:migrate && npm run test:mysql"
    depends_on:
      mysql: {condition: service_healthy}
      redis: {condition: service_healthy}
